<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线简历投递 · 芯动未来</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --primary-light: #818cf8;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --text: #1e293b;
    --text-light: #64748b;
    --text-lighter: #94a3b8;
    --card: rgba(255, 255, 255, 0.85);
    --border: rgba(226, 232, 240, 0.8);
    --shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 12px 40px rgba(15, 23, 42, 0.12);
    --radius: 12px;
    --radius-lg: 20px;
    --radius-xl: 28px;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    background-attachment: fixed; min-height: 100vh; padding: 24px 16px; color: var(--text); line-height: 1.6;
    -webkit-font-smoothing: antialiased; position: relative; overflow-x: hidden;
  }
  body::before, body::after {
    content: ''; position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
    filter: blur(80px); opacity: 0.4;
  }
  body::before { width: 500px; height: 500px; background: #fbbf24; top: -150px; right: -150px; }
  body::after { width: 400px; height: 400px; background: #34d399; bottom: -100px; left: -100px; }
  .container {
    max-width: 760px; margin: 0 auto; background: var(--card);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: var(--radius-xl); box-shadow: var(--shadow-lg);
    overflow: hidden; position: relative; z-index: 1;
    border: 1px solid rgba(255, 255, 255, 0.5);
  }
  .header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff; padding: 36px 32px; text-align: center; position: relative; overflow: hidden;
  }
  .header::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255,255,255,0.1) 0%, transparent 50%);
  }
  .header h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; position: relative; }
  .header p { opacity: 0.95; font-size: 14px; position: relative; }
  .body { padding: 28px 32px; }
  /* 步骤指示器 */
  .stepper { display: flex; justify-content: space-between; margin-bottom: 32px; position: relative; }
  .stepper::before {
    content: ''; position: absolute; top: 18px; left: 6%; right: 6%; height: 2px;
    background: var(--border); z-index: 0;
  }
  .step { flex: 1; text-align: center; position: relative; z-index: 1; }
  .step .dot {
    width: 36px; height: 36px; border-radius: 50%; background: #fff;
    border: 2px solid var(--border); display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: var(--text-lighter);
    transition: all 0.3s; margin-bottom: 6px;
  }
  .step.active .dot { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border-color: var(--primary); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4); }
  .step.done .dot { background: var(--success); color: #fff; border-color: var(--success); }
  .step .label { font-size: 12px; color: var(--text-lighter); font-weight: 500; }
  .step.active .label, .step.done .label { color: var(--text); font-weight: 600; }
  /* 步骤内容 */
  .step-panel { display: none; animation: fadeIn 0.3s ease; }
  .step-panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .panel-title {
    font-size: 18px; font-weight: 700; color: var(--text);
    margin-bottom: 6px; display: flex; align-items: center; gap: 8px;
  }
  .panel-desc { font-size: 13px; color: var(--text-light); margin-bottom: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .field label .required { color: var(--danger); margin-left: 2px; }
  .field label .hint { font-weight: 400; color: var(--text-lighter); font-size: 12px; margin-left: 6px; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
    border-radius: var(--radius); font-size: 14px; font-family: inherit; color: var(--text);
    background: #fff; transition: all 0.2s; -webkit-appearance: none;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
  }
  .field input:hover:not(:focus), .field textarea:hover:not(:focus), .field select:hover:not(:focus) {
    border-color: var(--primary-light);
  }
  .field select {
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
    background-repeat: no-repeat; background-position: right 12px center; background-size: 16px;
    padding-right: 36px;
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  /* 动态列表（教育/工作/家庭） */
  .repeat-section { background: #f8fafc; border: 1px dashed var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
  .repeat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .repeat-title { font-size: 13px; font-weight: 700; color: var(--primary); }
  .repeat-item { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; position: relative; }
  .repeat-item .remove { position: absolute; top: 8px; right: 8px; background: #fee2e2; color: #b91c1c; border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 14px; }
  .add-btn { width: 100%; padding: 10px; background: #fff; border: 1.5px dashed var(--primary-light); color: var(--primary); border-radius: var(--radius); cursor: pointer; font-size: 13px; font-weight: 600; }
  .add-btn:hover { background: #eef2ff; }
  /* 按钮 */
  .actions { display: flex; gap: 12px; margin-top: 28px; }
  .btn { flex: 1; padding: 13px 20px; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; }
  .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102, 126, 234, 0.5); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: #e2e8f0; }
  /* 成功页 */
  .success-page { text-align: center; padding: 40px 20px; display: none; }
  .success-page.active { display: block; }
  .success-icon { font-size: 80px; margin-bottom: 16px; animation: bounce 0.6s ease; }
  @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  .success-title { font-size: 22px; font-weight: 700; color: var(--success); margin-bottom: 8px; }
  .success-desc { color: var(--text-light); margin-bottom: 20px; }
  /* Toast */
  .toast {
    position: fixed; top: 24px; left: 50%; z-index: 1000;
    background: var(--success); color: #fff; padding: 14px 24px; border-radius: 99px;
    box-shadow: 0 10px 40px rgba(16, 185, 129, 0.4); font-size: 14px; font-weight: 500;
    transform: translateX(-50%) translateY(-200%); transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
    opacity: 0;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.hiding { transform: translateX(-50%) translateY(-50px); opacity: 0; }
  .toast.error { background: var(--danger); }
  /* 响应式 */
  @media (max-width: 600px) {
    body { padding: 12px; }
    .header { padding: 24px 18px; }
    .header h1 { font-size: 20px; }
    .body { padding: 18px; }
    .stepper { margin-bottom: 24px; }
    .stepper::before { left: 12%; right: 12%; }
    .step .dot { width: 30px; height: 30px; font-size: 12px; }
    .step .label { font-size: 11px; }
    .row, .row-3 { grid-template-columns: 1fr; }
    .actions { flex-direction: column-reverse; }
    .btn { width: 100%; }
  }
  @supports (padding: max(0px)) {
    body { padding-top: max(24px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom)); padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📝 在线简历投递</h1>
    <p>请如实填写以下信息，提交后 HR 会尽快与您联系</p>
  </div>

  <div class="body">
    <!-- 步骤指示器 -->
    <div class="stepper" id="stepper">
      <div class="step active" data-step="1"><div class="dot">1</div><div class="label">基本信息</div></div>
      <div class="step" data-step="2"><div class="dot">2</div><div class="label">应聘信息</div></div>
      <div class="step" data-step="3"><div class="dot">3</div><div class="label">教育背景</div></div>
      <div class="step" data-step="4"><div class="dot">4</div><div class="label">工作经历</div></div>
      <div class="step" data-step="5"><div class="dot">5</div><div class="label">其他信息</div></div>
    </div>

    <form id="resumeForm">
      <!-- Step 1: 基本信息 -->
      <div class="step-panel active" data-panel="1">
        <div class="panel-title">👤 基本信息</div>
        <div class="panel-desc">必填项标有 <span style="color:var(--danger)">*</span></div>
        <div class="row">
          <div class="field"><label>姓名 <span class="required">*</span></label><input type="text" name="name" required></div>
          <div class="field"><label>姓名拼音</label><input type="text" name="name_pinyin" placeholder="如：zhangsan"></div>
        </div>
        <div class="row-3">
          <div class="field"><label>性别 <span class="required">*</span></label>
            <select name="gender" required><option value="">--</option><option>男</option><option>女</option></select>
          </div>
          <div class="field"><label>出生日期</label><input type="date" name="birth_date"></div>
          <div class="field"><label>民族</label><input type="text" name="nation" placeholder="如：汉"></div>
        </div>
        <div class="row">
          <div class="field"><label>手机号 <span class="required">*</span></label><input type="tel" name="phone" required placeholder="11位手机号"></div>
          <div class="field"><label>电子邮箱</label><input type="email" name="email" placeholder="example@xx.com"></div>
        </div>
        <div class="row">
          <div class="field"><label>身份证号</label><input type="text" name="id_card" maxlength="18"></div>
          <div class="field"><label>QQ 号</label><input type="text" name="qq"></div>
        </div>
        <div class="row">
          <div class="field"><label>婚姻状况</label>
            <select name="marital_status"><option value="">--</option><option>未婚</option><option>已婚</option><option>离异</option><option>丧偶</option></select>
          </div>
          <div class="field"><label>政治面貌</label>
            <select name="political_status"><option value="">--</option><option>群众</option><option>团员</option><option>党员</option><option>民主党派</option><option>无党派人士</option></select>
          </div>
        </div>
        <div class="field"><label>现居住地</label><input type="text" name="current_address" placeholder="详细地址"></div>
        <div class="row">
          <div class="field"><label>籍贯</label><input type="text" name="native_place" placeholder="如：浙江省杭州市"></div>
          <div class="field"><label>户口类别</label>
            <select name="household_type"><option value="">--</option><option>本地城镇</option><option>本地农村</option><option>外地城镇</option><option>外地农村</option></select>
          </div>
        </div>
        <div class="row">
          <div class="field"><label>英语水平</label>
            <select name="english_level"><option value="">--</option><option>四级</option><option>六级</option><option>专四</option><option>专八</option><option>雅思</option><option>托福</option><option>无</option></select>
          </div>
          <div class="field"><label>驾照</label>
            <select name="driver_license"><option value="">--</option><option>无</option><option>C1</option><option>C2</option><option>B1</option><option>B2</option><option>A1</option><option>A2</option></select>
          </div>
        </div>
      </div>

      <!-- Step 2: 应聘信息 -->
      <div class="step-panel" data-panel="2">
        <div class="panel-title">💼 应聘信息</div>
        <div class="panel-desc">告诉我们您想应聘的岗位</div>
        <div class="field"><label>应聘岗位 <span class="required">*</span></label>
          <select name="apply_position" required>
            <option value="">-- 请选择 --</option>
            <option>销售</option>
            <option>主播</option>
            <option>短视频运营</option>
            <option>短视频拍摄/剪辑</option>
            <option>投流手</option>
            <option>美工/设计</option>
            <option>业务中台</option>
            <option>数据中台</option>
            <option>人事</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="row">
          <div class="field"><label>应聘渠道</label>
            <select name="apply_channel">
              <option value="">--</option>
              <option>BOSS直聘</option>
              <option>智联招聘</option>
              <option>前程无忧</option>
              <option>脉脉</option>
              <option>猎聘</option>
              <option>公司官网</option>
              <option>内推</option>
              <option>朋友介绍</option>
              <option value="其他">其他（请注明）</option>
            </select>
          </div>
          <div class="field"><label>其他渠道说明</label><input type="text" name="channel_other" placeholder="如果选'其他'请说明"></div>
        </div>
        <div class="row">
          <div class="field"><label>推荐人</label><input type="text" name="referrer" placeholder="推荐人姓名"></div>
          <div class="field"><label>猎头公司</label><input type="text" name="headhunter" placeholder="如有"></div>
        </div>
        <div class="row">
          <div class="field"><label>档案所在地</label><input type="text" name="archive_location"></div>
          <div class="field"><label>户口所在地</label><input type="text" name="household_address"></div>
        </div>
        <div class="row">
          <div class="field"><label>与原单位是否解除劳动关系</label>
            <select name="original_company_released"><option value="">--</option><option>是</option><option>否</option><option>不适用</option></select>
          </div>
          <div class="field"><label>是否签订过竞业禁止</label>
            <select name="non_compete"><option value="">--</option><option>是</option><option>否</option></select>
          </div>
        </div>
        <div class="row">
          <div class="field"><label>是否已办理社保</label>
            <select name="has_social_security"><option value="">--</option><option>是</option><option>否</option></select>
          </div>
          <div class="field"><label>社保缴纳地</label><input type="text" name="social_security_location" placeholder="如：杭州西湖区"></div>
        </div>
        <div class="row">
          <div class="field"><label>是否有亲友在本公司</label>
            <select name="has_relatives"><option value="">--</option><option>是</option><option>否</option></select>
          </div>
          <div class="field"><label>亲友姓名</label><input type="text" name="relative_name"></div>
        </div>
        <div class="row">
          <div class="field"><label>紧急联系人</label><input type="text" name="emergency_contact"></div>
          <div class="field"><label>紧急联系电话</label><input type="tel" name="emergency_phone"></div>
        </div>
      </div>

      <!-- Step 3: 教育背景 -->
      <div class="step-panel" data-panel="3">
        <div class="panel-title">🎓 教育背景</div>
        <div class="panel-desc">从最近教育经历开始倒序填写，可添加多段</div>
        <div id="eduList"></div>
        <button type="button" class="add-btn" onclick="addEdu()">+ 添加一段教育经历</button>
      </div>

      <!-- Step 4: 工作经历 -->
      <div class="step-panel" data-panel="4">
        <div class="panel-title">💼 工作经历</div>
        <div class="panel-desc">从最近工作经历开始倒序填写，可添加多段</div>
        <div id="workList"></div>
        <button type="button" class="add-btn" onclick="addWork()">+ 添加一段工作经历</button>
      </div>

      <!-- Step 5: 其他信息 -->
      <div class="step-panel" data-panel="5">
        <div class="panel-title">✨ 其他信息</div>
        <div class="panel-desc">职称、获奖、家庭成员等</div>
        <div class="row">
          <div class="field"><label>获得职称时间</label><input type="text" name="title_time" placeholder="如：2020-06"></div>
          <div class="field"><label>职称名称</label><input type="text" name="title_name"></div>
        </div>
        <div class="row">
          <div class="field"><label>获得职业资格时间</label><input type="text" name="cert_time" placeholder="如：2021-09"></div>
          <div class="field"><label>职业资格名称</label><input type="text" name="cert_name"></div>
        </div>
        <div class="field"><label>工作业绩 / 获奖</label><textarea name="achievements" placeholder="主要工作业绩、获奖经历..."></textarea></div>
        <div class="row">
          <div class="field"><label>个人特长</label><textarea name="specialty" placeholder="如：善于交流，团队精神..."></textarea></div>
          <div class="field"><label>兴趣爱好</label><textarea name="hobby"></textarea></div>
        </div>

        <div style="margin-top:18px;font-size:13px;color:var(--text-light);background:#fff7e6;padding:12px;border-radius:var(--radius);border:1px solid #fde68a;">
          ⚠️ <b>承诺</b>：以上信息均为本人真实填写，如有虚假或隐瞒，本人愿接受公司相应处理。
        </div>

        <div class="field" style="margin-top:14px;">
          <label>家庭成员（可选）</label>
          <div id="familyList"></div>
          <button type="button" class="add-btn" onclick="addFamily()">+ 添加家庭成员</button>
        </div>
      </div>

      <!-- 操作按钮 -->
      <div class="actions" id="mainActions">
        <button type="button" class="btn btn-secondary" id="prevBtn" onclick="prevStep()" style="display:none">← 上一步</button>
        <button type="button" class="btn btn-primary" id="nextBtn" onclick="nextStep()">下一步 →</button>
      </div>
    </form>

    <!-- 成功页 -->
    <div class="success-page" id="successPage">
      <div class="success-icon">🎉</div>
      <div class="success-title">投递成功！</div>
      <div class="success-desc" id="successMsg">HR 会尽快查看您的简历并与您联系</div>
      <button class="btn btn-secondary" onclick="location.reload()" style="max-width:240px;margin:0 auto;">再投一份</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">操作成功</div>

<script>
const API_BASE = 'https://universe-fall-return-hosts.trycloudflare.com';
let toastTimer = null;
function showToast(msg, isError, duration = 2500) {
  const t = document.getElementById('toast');
  if (!t) return;
  if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
  t.classList.remove('show', 'hiding', 'error');
  t.textContent = msg;
  void t.offsetWidth;
  t.className = 'toast' + (isError ? ' error' : '');
  requestAnimationFrame(() => t.classList.add('show'));
  toastTimer = setTimeout(() => {
    t.classList.remove('show');
    t.classList.add('hiding');
    setTimeout(() => t.classList.remove('hiding', 'error'), 400);
    toastTimer = null;
  }, duration);
}

let currentStep = 1;
const totalSteps = 5;

function showStep(n) {
  currentStep = n;
  document.querySelectorAll('.step').forEach(el => {
    const s = parseInt(el.dataset.step);
    el.classList.toggle('active', s === n);
    el.classList.toggle('done', s < n);
  });
  document.querySelectorAll('.step-panel').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.panel) === n);
  });
  document.getElementById('prevBtn').style.display = n === 1 ? 'none' : '';
  document.getElementById('nextBtn').textContent = n === totalSteps ? '✅ 提交简历' : '下一步 →';
  document.getElementById('nextBtn').onclick = n === totalSteps ? submitForm : nextStep;
  // 滚到顶部
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextStep() {
  // 校验当前步骤必填
  if (currentStep === 1) {
    const form = document.getElementById('resumeForm');
    const name = form.querySelector('[name=name]').value.trim();
    const phone = form.querySelector('[name=phone]').value.trim();
    const gender = form.querySelector('[name=gender]').value;
    if (!name) { showToast('请填写姓名', true); return; }
    if (!gender) { showToast('请选择性别', true); return; }
    if (!phone || !/^1\d{10}$/.test(phone)) { showToast('请填写正确的11位手机号', true); return; }
  } else if (currentStep === 2) {
    const form = document.getElementById('resumeForm');
    const pos = form.querySelector('[name=apply_position]').value;
    if (!pos) { showToast('请选择应聘岗位', true); return; }
  }
  if (currentStep < totalSteps) showStep(currentStep + 1);
}

function prevStep() { if (currentStep > 1) showStep(currentStep - 1); }

// 收集表单
function collectData() {
  const form = document.getElementById('resumeForm');
  const fd = new FormData(form);
  const data = Object.fromEntries(fd.entries());
  // 教育
  data.education = [];
  document.querySelectorAll('.edu-item').forEach(item => {
    const ed = {};
    item.querySelectorAll('[data-edu]').forEach(el => ed[el.dataset.edu] = el.value);
    if (Object.values(ed).some(v => v)) data.education.push(ed);
  });
  // 工作
  data.work = [];
  document.querySelectorAll('.work-item').forEach(item => {
    const w = {};
    item.querySelectorAll('[data-work]').forEach(el => w[el.dataset.work] = el.value);
    if (Object.values(w).some(v => v)) data.work.push(w);
  });
  // 家庭
  data.family = [];
  document.querySelectorAll('.family-item').forEach(item => {
    const f = {};
    item.querySelectorAll('[data-family]').forEach(el => f[el.dataset.family] = el.value);
    if (Object.values(f).some(v => v)) data.family.push(f);
  });
  return data;
}

async function submitForm() {
  // 最终确认
  if (!confirm('确认提交简历？提交后将进入审核流程。')) return;
  const data = collectData();
  const btn = document.getElementById('nextBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading"></span>提交中...';
  try {
    const resp = await fetch(API_BASE + '/api/resume', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await resp.json();
    if (result.success) {
      // 隐藏表单显示成功页
      document.getElementById('stepper').style.display = 'none';
      document.getElementById('mainActions').style.display = 'none';
      document.querySelectorAll('.step-panel').forEach(el => el.style.display = 'none');
      document.getElementById('successPage').classList.add('active');
      document.getElementById('successMsg').textContent = result.message || 'HR 会尽快与您联系';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      throw new Error(result.error || '提交失败');
    }
  } catch (e) {
    showToast('提交失败：' + e.message + '，请稍后重试', true, 4000);
    btn.disabled = false;
    btn.innerHTML = '✅ 提交简历';
  }
}
