<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人才库 · 中台部门</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #6366f1; --primary-dark: #4f46e5; --primary-light: #818cf8;
    --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
    --text: #0f172a; --text-light: #64748b; --text-lighter: #94a3b8;
    --card: rgba(255, 255, 255, 0.85); --card-solid: #ffffff;
    --border: rgba(226, 232, 240, 0.7);
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
    --shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 20px 60px rgba(15, 23, 42, 0.15);
    --radius: 12px; --radius-lg: 20px; --radius-xl: 28px;
    --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
    min-height: 100vh; padding: 20px 16px; color: var(--text); line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1200px; margin: 0 auto; }

  /* ========== 头部 ========== */
  .header {
    background: var(--gradient);
    color: #fff; padding: 32px 32px 28px; border-radius: var(--radius-xl);
    box-shadow: var(--shadow); margin-bottom: 20px; position: relative; overflow: hidden;
  }
  .header::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255,255,255,0.1) 0%, transparent 50%);
  }
  .header-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; position: relative; }
  .header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .header .sub { font-size: 13px; opacity: 0.9; margin-top: 4px; }
  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .header-actions a, .header-actions button {
    padding: 8px 14px; background: rgba(255,255,255,0.15); color: #fff;
    border: 1px solid rgba(255,255,255,0.25); border-radius: 99px;
    font-size: 13px; font-weight: 500; text-decoration: none; cursor: pointer;
    transition: all 0.2s; backdrop-filter: blur(10px);
    font-family: inherit; display: inline-flex; align-items: center; gap: 4px;
  }
  .header-actions a:hover, .header-actions button:hover { background: rgba(255,255,255,0.3); transform: translateY(-1px); }
  .header-actions .primary { background: #fff; color: var(--primary-dark); border-color: #fff; font-weight: 600; }
  .header-actions .primary:hover { background: #f8fafc; }
  .header-actions .admin-on { background: #10b981 !important; border-color: #10b981 !important; }

  /* ========== 统计卡片 ========== */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px; margin-bottom: 20px; }
  .stat {
    background: var(--card-solid); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 18px 20px; transition: all 0.2s;
  }
  .stat:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .stat .label { font-size: 12px; color: var(--text-light); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat .num { font-size: 28px; font-weight: 800; margin: 6px 0 2px; background: var(--gradient);
    -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.1; }
  .stat .sub { font-size: 12px; color: var(--text-lighter); }

  /* ========== 工具栏 ========== */
  .toolbar {
    background: var(--card-solid); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 14px 18px; margin-bottom: 16px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  .toolbar input, .toolbar select {
    padding: 9px 14px; border: 1.5px solid var(--border);
    border-radius: 10px; font-size: 13px; background: #fff; color: var(--text);
    font-family: inherit; transition: all 0.2s;
  }
  .toolbar input { flex: 1; min-width: 180px; }
  .toolbar select { min-width: 130px; }
  .toolbar input:focus, .toolbar select:focus { outline: none; border-color: var(--primary); }
  .toolbar .refresh {
    padding: 9px 16px; background: #f1f5f9; color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    font-size: 13px; cursor: pointer; font-weight: 500;
    font-family: inherit; display: inline-flex; align-items: center; gap: 4px;
    transition: all 0.2s;
  }
  .toolbar .refresh:hover { background: #e2e8f0; }
  .toolbar .refresh.loading svg { animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  /* ========== 列表 ========== */
  .list { display: grid; gap: 12px; }
  .item {
    background: var(--card-solid); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 18px 20px;
    display: flex; gap: 16px; align-items: center;
    transition: all 0.2s; position: relative;
  }
  .item:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--primary-light); }
  .item.blacklist { background: #fef2f2; border-color: #fecaca; }
  .item.blacklist:hover { border-color: #f87171; }
  .avatar {
    width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: #fff;
    background: var(--gradient);
  }
  .item.blacklist .avatar { background: linear-gradient(135deg, #6b7280 0%, #374151 100%); }
  .item .info { flex: 1; min-width: 0; }
  .item .name { font-size: 16px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item .name .strike { text-decoration: line-through; color: #9ca3af; }
  .item .meta { font-size: 13px; color: var(--text-light); margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
  .item .meta span { display: inline-flex; align-items: center; gap: 3px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tag { padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .tag.position { background: #eef2ff; color: var(--primary-dark); }
  .tag.source { background: #f1f5f9; color: var(--text-light); }
  .tag.A { background: #fef3c7; color: #92400e; }
  .tag.B { background: #dbeafe; color: #1e40af; }
  .tag.C { background: #e5e7eb; color: #374151; }
  .tag.在库 { background: #d1fae5; color: #065f46; }
  .tag.面试 { background: #dbeafe; color: #1e40af; }
  .tag.已联系 { background: #f3e8ff; color: #6b21a8; }
  .tag.黑名单 { background: #fee2e2; color: #991b1b; }
  .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .actions button {
    padding: 7px 12px; border: none; border-radius: 8px;
    font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
    transition: all 0.2s; white-space: nowrap;
  }
  .actions .edit { background: #eef2ff; color: var(--primary-dark); }
  .actions .edit:hover { background: var(--primary); color: #fff; }
  .actions .danger { background: #fee2e2; color: #b91c1c; }
  .actions .danger:hover { background: var(--danger); color: #fff; }
  .actions .success { background: #d1fae5; color: #065f46; }
  .actions .success:hover { background: var(--success); color: #fff; }
  .readonly { font-size: 12px; color: var(--text-lighter); padding: 7px 0; }

  /* ========== 弹窗 ========== */
  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5);
    backdrop-filter: blur(8px); z-index: 100; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-bg.show { display: flex; animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: #fff; border-radius: var(--radius-lg);
    max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto;
    box-shadow: var(--shadow-lg);
  }
  .modal-head { padding: 20px 24px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; }
  .modal-head h2 { font-size: 18px; font-weight: 700; }
  .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-light); padding: 0; }
  .modal-body { padding: 24px; }
  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .form-row input, .form-row select, .form-row textarea {
    width: 100%; padding: 10px 14px; border: 1.5px solid var(--border);
    border-radius: 10px; font-size: 14px; font-family: inherit; color: var(--text);
    background: #fff; transition: all 0.2s;
  }
  .form-row textarea { resize: vertical; min-height: 70px; }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
    outline: none; border-color: var(--primary);
  }
  .form-row select {
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
    background-repeat: no-repeat; background-position: right 12px center; background-size: 16px;
    padding-right: 36px;
  }
  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-foot { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
  .btn-primary { padding: 10px 20px; background: var(--gradient); color: #fff;
    border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: all 0.2s; }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4); }
  .btn-secondary { padding: 10px 20px; background: #f1f5f9; color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-weight: 500;
    cursor: pointer; font-family: inherit; transition: all 0.2s; }
  .btn-secondary:hover { background: #e2e8f0; }

  /* ========== 空 / 加载 / 错误 ========== */
  .empty, .loading, .error {
    background: var(--card-solid); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 50px 20px; text-align: center;
  }
  .empty .icon, .loading .icon, .error .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.6; }
  .empty .title, .loading .title, .error .title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .empty .desc, .loading .desc, .error .desc { font-size: 13px; color: var(--text-light); margin-bottom: 16px; }
  .loading .icon { animation: pulse 1.5s ease-in-out infinite; }
  .error .icon { opacity: 1; }
  .error button { padding: 9px 18px; background: var(--danger); color: #fff;
    border: none; border-radius: 10px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit; }
  @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  .skeleton { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
    background-size: 200% 100%; animation: skeleton 1.5s infinite;
    border-radius: 6px; height: 14px; }
  @keyframes skeleton { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .skeleton-item { background: var(--card-solid); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 18px 20px; display: flex; gap: 16px; }
  .skeleton-item .sk-avatar { width: 48px; height: 48px; border-radius: 50%; }
  .skeleton-item .sk-info { flex: 1; }
  .skeleton-item .sk-line { margin-bottom: 8px; }

  /* ========== Toast ========== */
  .toast {
    position: fixed; top: 24px; left: 50%; z-index: 200;
    background: var(--success); color: #fff; padding: 14px 24px; border-radius: 99px;
    box-shadow: 0 10px 40px rgba(16, 185, 129, 0.4); font-size: 14px; font-weight: 500;
    transform: translateX(-50%) translateY(-200%); opacity: 0;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.error { background: var(--danger); }
  .badge-pulse {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #10b981; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
    animation: pulse-ring 1.5s infinite;
  }
  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
    70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
    100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }

  /* ========== 响应式 ========== */
  @media (max-width: 600px) {
    body { padding: 12px; }
    .header { padding: 24px 20px; }
    .header h1 { font-size: 22px; }
    .header-actions a, .header-actions button { font-size: 12px; padding: 6px 12px; }
    .stat { padding: 14px 16px; }
    .stat .num { font-size: 22px; }
    .item { padding: 14px 16px; gap: 12px; }
    .avatar { width: 40px; height: 40px; font-size: 15px; }
    .item .name { font-size: 14px; }
    .item .meta { font-size: 12px; }
    .actions button { font-size: 11px; padding: 5px 8px; }
    .form-grid-2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <!-- 头部 -->
  <div class="header">
    <div class="header-row">
      <div>
        <h1>🌟 人才库</h1>
        <div class="sub">把优秀人才存到这里，长期跟踪，永久可查</div>
      </div>
      <div class="header-actions">
        <a href="index.html">📝 填写日报</a>
        <a href="resume-admin.html">📋 简历管理</a>
        <a href="report-summary.html">📊 日报汇总</a>
        <button class="primary" id="addBtn" onclick="toggleForm()">+ 添加人才</button>
        <button id="authBtn" onclick="showAuth()">🔒 人事登录</button>
      </div>
    </div>
  </div>

  <!-- 统计 -->
  <div class="stats" id="stats">
    <div class="stat"><div class="label">总人数</div><div class="num" id="statTotal">-</div><div class="sub">人才库</div></div>
    <div class="stat"><div class="label">在库</div><div class="num" id="statActive" style="background:linear-gradient(135deg,#10b981,#059669);-webkit-background-clip:text;background-clip:text;color:transparent">-</div><div class="sub">可联系</div></div>
    <div class="stat"><div class="label">面试中</div><div class="num" id="statInterview" style="background:linear-gradient(135deg,#3b82f6,#1d4ed8);-webkit-background-clip:text;background-clip:text;color:transparent">-</div><div class="sub">流程中</div></div>
    <div class="stat"><div class="label">黑名单</div><div class="num" id="statBlacklist" style="background:linear-gradient(135deg,#ef4444,#b91c1c);-webkit-background-clip:text;background-clip:text;color:transparent">-</div><div class="sub">已拉黑</div></div>
  </div>

  <!-- 工具栏 -->
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍 搜索姓名/手机/微信/邮箱/备注..." />
    <select id="statusFilter">
      <option value="">全部状态</option>
      <option>在库</option>
      <option>面试</option>
      <option>已联系</option>
      <option>黑名单</option>
    </select>
    <select id="positionFilter">
      <option value="">全部岗位</option>
      <option>销售</option>
      <option>主播</option>
      <option>短视频运营</option>
      <option>短视频拍摄/剪辑</option>
      <option>投流手</option>
      <option>美工/设计</option>
      <option>业务中台</option>
      <option>数据中台</option>
      <option>人事</option>
    </select>
    <button class="refresh" id="refreshBtn" onclick="loadList(true)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
      </svg>
      刷新
    </button>
  </div>

  <!-- 列表 -->
  <div class="list" id="list"></div>
</div>

<!-- 编辑弹窗 -->
<div class="modal-bg" id="editModal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="formTitle">添加人才</h2>
      <button class="modal-close" onclick="hideForm()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid-2">
        <div class="form-row"><label>姓名 <span style="color:var(--danger)">*</span></label><input type="text" id="fName" placeholder="必填"></div>
        <div class="form-row"><label>手机号</label><input type="tel" id="fPhone"></div>
      </div>
      <div class="form-grid-2">
        <div class="form-row"><label>微信号</label><input type="text" id="fWechat"></div>
        <div class="form-row"><label>邮箱</label><input type="email" id="fEmail"></div>
      </div>
      <div class="form-grid-2">
        <div class="form-row"><label>应聘岗位</label>
          <select id="fPosition">
            <option value="">--</option>
            <option>销售</option><option>主播</option><option>短视频运营</option>
            <option>短视频拍摄/剪辑</option><option>投流手</option><option>美工/设计</option>
            <option>业务中台</option><option>数据中台</option><option>人事</option>
          </select>
        </div>
        <div class="form-row"><label>来源</label>
          <select id="fSource">
            <option value="">--</option>
            <option>BOSS直聘</option><option>智联招聘</option><option>前程无忧</option>
            <option>脉脉</option><option>猎聘</option><option>公司官网</option>
            <option>内推</option><option>朋友介绍</option><option>在线简历</option>
          </select>
        </div>
      </div>
      <div class="form-grid-2">
        <div class="form-row"><label>评级</label>
          <select id="fRating"><option>A</option><option selected>B</option><option>C</option></select>
        </div>
        <div class="form-row"><label>状态</label>
          <select id="fStatus"><option>在库</option><option>面试</option><option>已联系</option></select>
        </div>
      </div>
      <div class="form-row"><label>备注</label><textarea id="fNotes" placeholder="技能 / 经历 / 沟通要点..."></textarea></div>
      <div class="form-row"><label>录入人</label><input type="text" id="fCreatedBy" placeholder="如：人事-小李"></div>
    </div>
    <div class="modal-foot">
      <button class="btn-secondary" onclick="hideForm()">取消</button>
      <button class="btn-primary" id="saveBtn" onclick="saveTalent()">保存</button>
    </div>
  </div>
</div>

<!-- 鉴权弹窗 -->
<div class="modal-bg" id="authModal">
  <div class="modal" style="max-width:380px">
    <div class="modal-head">
      <h2>🔐 人事专员登录</h2>
      <button class="modal-close" onclick="hideAuth()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label>通行令牌</label>
        <input type="password" id="authToken" placeholder="请输入 HR 通行令牌" onkeydown="if(event.key==='Enter')doAuth()">
      </div>
      <p style="font-size:12px;color:var(--text-lighter);text-align:center;margin-top:8px">
        仅人事专员可编辑，其他用户为只读
      </p>
    </div>
    <div class="modal-foot">
      <button class="btn-secondary" onclick="hideAuth()">取消</button>
      <button class="btn-primary" onclick="doAuth()">登录</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = 'https://translate-consultation-layer-emails.trycloudflare.com';
const TOKEN_KEY = 'talent_admin_token';
const CACHE_KEY = 'talent_cache_v1';
const CACHE_TTL = 5 * 60 * 1000; // 5 分钟

let allItems = [];
let editingId = null;
let adminToken = localStorage.getItem(TOKEN_KEY) || '';
let isLoading = false;

// ============ 缓存：立即渲染 ============
function loadFromCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const c = JSON.parse(raw);
    if (Date.now() - c.ts > CACHE_TTL) return null;
    return c.list || [];
  } catch (e) { return null; }
}
function saveToCache(list) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), list }));
  } catch (e) {}
}
function clearCache() { localStorage.removeItem(CACHE_KEY); }

// ============ Toast ============
let toastTimer = null;
function showToast(msg, isError, duration = 2500) {
  const t = document.getElementById('toast');
  if (!t) return;
  if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = msg;
  void t.offsetWidth;
  requestAnimationFrame(() => t.classList.add('show'));
  toastTimer = setTimeout(() => t.classList.remove('show'), duration);
}

// ============ 鉴权 ============
function isAdmin() { return !!adminToken; }
function updateAuthUI() {
  const btn = document.getElementById('authBtn');
  if (isAdmin()) {
    btn.className = 'admin-on';
    btn.innerHTML = '✅ 已登录';
    btn.onclick = logout;
  } else {
    btn.className = '';
    btn.innerHTML = '🔒 人事登录';
    btn.onclick = showAuth;
  }
  renderList();
}
function showAuth() { document.getElementById('authModal').classList.add('show'); document.getElementById('authToken').focus(); }
function hideAuth() { document.getElementById('authModal').classList.remove('show'); document.getElementById('authToken').value = ''; }
async function doAuth() {
  const token = document.getElementById('authToken').value.trim();
  if (!token) return showToast('请输入令牌', true);
  try {
    const resp = await fetch(API_BASE + '/api/talent/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token })
    });
    const data = await resp.json();
    if (data.success) {
      adminToken = token;
      localStorage.setItem(TOKEN_KEY, token);
      hideAuth();
      updateAuthUI();
      showToast('✅ 验证成功，已解锁编辑权限');
    } else {
      throw new Error(data.error || '令牌错误');
    }
  } catch (e) { showToast('验证失败：' + e.message, true); }
}
function logout() {
  if (!confirm('退出人事专员模式？')) return;
  adminToken = '';
  localStorage.removeItem(TOKEN_KEY);
  updateAuthUI();
  showToast('已退出');
}

// ============ 列表 ============
async function loadList(force = false) {
  if (isLoading) return;
  isLoading = true;
  const refreshBtn = document.getElementById('refreshBtn');
  refreshBtn.classList.add('loading');

  // 1. 立即用缓存渲染（不阻塞）
  if (!force) {
    const cached = loadFromCache();
    if (cached && cached.length > 0) {
      allItems = cached;
      renderList();
    } else {
      renderSkeleton();
    }
  } else {
    renderSkeleton();
  }

  // 2. 后台 fetch 最新
  const kw = document.getElementById('searchInput').value.trim();
  const status = document.getElementById('statusFilter').value;
  const position = document.getElementById('positionFilter').value;
  const params = new URLSearchParams();
  if (kw) params.set('keyword', kw);
  if (status) params.set('status', status);
  if (position) params.set('position', position);

  try {
    const ctrl = new AbortController();
    const timeoutId = setTimeout(() => ctrl.abort(), 15000);
    const resp = await fetch(API_BASE + '/api/talent?' + params.toString(), { signal: ctrl.signal });
    clearTimeout(timeoutId);
    const data = await resp.json();
    if (data.success) {
      allItems = data.list;
      saveToCache(allItems); // 缓存最新
      renderList();
    } else {
      throw new Error(data.error || '加载失败');
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      showToast('请求超时，请检查网络', true);
    }
    if (!allItems.length) renderError(e.message || '网络错误');
  } finally {
    isLoading = false;
    refreshBtn.classList.remove('loading');
  }
}

function renderSkeleton() {
  const listEl = document.getElementById('list');
  listEl.innerHTML = Array(3).fill(0).map(() => `
    <div class="skeleton-item">
      <div class="skeleton sk-avatar"></div>
      <div class="sk-info">
        <div class="skeleton sk-line" style="width: 40%"></div>
        <div class="skeleton sk-line" style="width: 70%"></div>
        <div class="skeleton sk-line" style="width: 50%"></div>
      </div>
    </div>
  `).join('');
}

function renderError(msg) {
  document.getElementById('list').innerHTML = `
    <div class="error">
      <div class="icon">⚠️</div>
      <div class="title">加载失败</div>
      <div class="desc">${escape(msg)}</div>
      <button onclick="loadList(true)">🔄 重新加载</button>
    </div>
  `;
}

function renderList() {
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  const status = document.getElementById('statusFilter').value;
  const position = document.getElementById('positionFilter').value;
  let items = allItems;
  if (kw) items = items.filter(t =>
    (t.name||'').toLowerCase().includes(kw) ||
    (t.phone||'').includes(kw) ||
    (t.wechat||'').toLowerCase().includes(kw) ||
    (t.email||'').toLowerCase().includes(kw) ||
    (t.notes||'').toLowerCase().includes(kw)
  );
  if (status) items = items.filter(t => t.status === status);
  if (position) items = items.filter(t => t.position === position);

  // 统计（用全部数据，不是过滤后）
  const total = allItems.length;
  const active = allItems.filter(t => t.status === '在库').length;
  const interview = allItems.filter(t => t.status === '面试').length;
  const blacklist = allItems.filter(t => t.status === '黑名单').length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statActive').textContent = active;
  document.getElementById('statInterview').textContent = interview;
  document.getElementById('statBlacklist').textContent = blacklist;

  const listEl = document.getElementById('list');
  if (!items.length) {
    listEl.innerHTML = allItems.length === 0
      ? `<div class="empty"><div class="icon">📭</div><div class="title">人才库还是空的</div><div class="desc">点击右上角"+ 添加人才"开始录入，或等待简历投递</div></div>`
      : `<div class="empty"><div class="icon">🔍</div><div class="title">没找到匹配的人才</div><div class="desc">试试调整搜索词或筛选条件</div></div>`;
    return;
  }

  listEl.innerHTML = items.map(t => {
    const isBlacklist = t.status === '黑名单';
    const initial = (t.name || '?').slice(0, 1).toUpperCase();
    const actions = isAdmin() ? (
      isBlacklist
        ? `<button class="success" onclick="restoreTalent(${t.id})">解除</button><button class="danger" onclick="deleteTalent(${t.id})">删除</button>`
        : `<button class="edit" onclick="editTalent(${t.id})">编辑</button><button class="danger" onclick="blacklistTalent(${t.id})">拉黑</button>`
    ) : '<div class="readonly">只读</div>';
    return `<div class="item ${isBlacklist ? 'blacklist' : ''}">
      <div class="avatar">${escape(initial)}</div>
      <div class="info">
        <div class="name">
          <span class="${isBlacklist ? 'strike' : ''}">${escape(t.name)}</span>
          ${t.position ? `<span class="tag position">${escape(t.position)}</span>` : ''}
          <span class="tag ${t.rating || 'B'}">${t.rating || 'B'}</span>
          ${t.status ? `<span class="tag ${escape(t.status)}">${isBlacklist ? '🚫 ' : ''}${escape(t.status)}</span>` : ''}
        </div>
        <div class="meta">
          ${t.phone ? `<span>📱 <a href="tel:${escape(t.phone)}" style="color:inherit;text-decoration:none">${escape(t.phone)}</a></span>` : ''}
          ${t.wechat ? `<span>💬 ${escape(t.wechat)}</span>` : ''}
          ${t.email ? `<span>📧 ${escape(t.email)}</span>` : ''}
          ${t.source ? `<span>📢 ${escape(t.source)}</span>` : ''}
        </div>
        ${t.notes ? `<div style="font-size:12px;color:var(--text-light);margin-top:6px;line-height:1.5">${escape(t.notes).slice(0, 100)}${t.notes.length > 100 ? '...' : ''}</div>` : ''}
      </div>
      <div class="actions">${actions}</div>
    </div>`;
  }).join('');
}

function escape(s) { return s ? String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]) : ''; }

// ============ 编辑表单 ============
function toggleForm() {
  if (!isAdmin()) { showAuth(); return; }
  document.getElementById('editModal').classList.add('show');
  resetForm();
}
function hideForm() { document.getElementById('editModal').classList.remove('show'); }
function resetForm() {
  editingId = null;
  document.getElementById('formTitle').textContent = '添加人才';
  ['fName','fPhone','fWechat','fEmail','fNotes','fCreatedBy'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fPosition').value = '';
  document.getElementById('fSource').value = '';
  document.getElementById('fRating').value = 'B';
  document.getElementById('fStatus').value = '在库';
}
function editTalent(id) {
  if (!isAdmin()) return;
  const t = allItems.find(x => x.id === id);
  if (!t) return;
  editingId = id;
  document.getElementById('formTitle').textContent = '编辑人才';
  document.getElementById('fName').value = t.name || '';
  document.getElementById('fPhone').value = t.phone || '';
  document.getElementById('fWechat').value = t.wechat || '';
  document.getElementById('fEmail').value = t.email || '';
  document.getElementById('fPosition').value = t.position || '';
  document.getElementById('fSource').value = t.source || '';
  document.getElementById('fRating').value = t.rating || 'B';
  document.getElementById('fStatus').value = t.status || '在库';
  document.getElementById('fNotes').value = t.notes || '';
  document.getElementById('fCreatedBy').value = t.created_by || '';
  document.getElementById('editModal').classList.add('show');
}
async function saveTalent() {
  if (!isAdmin()) return;
  const name = document.getElementById('fName').value.trim();
  if (!name) return showToast('请填写姓名', true);
  const data = {
    name,
    phone: document.getElementById('fPhone').value.trim(),
    wechat: document.getElementById('fWechat').value.trim(),
    email: document.getElementById('fEmail').value.trim(),
    position: document.getElementById('fPosition').value,
    source: document.getElementById('fSource').value,
    rating: document.getElementById('fRating').value,
    status: document.getElementById('fStatus').value,
    notes: document.getElementById('fNotes').value.trim(),
    created_by: document.getElementById('fCreatedBy').value.trim(),
  };
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = '保存中...';
  try {
    const url = editingId ? (API_BASE + '/api/talent/' + editingId) : (API_BASE + '/api/talent');
    const method = editingId ? 'PUT' : 'POST';
    const resp = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + adminToken },
      body: JSON.stringify(data)
    });
    const result = await resp.json();
    if (result.success) {
      showToast(editingId ? '✅ 已更新' : '✅ 已添加');
      hideForm();
      await loadList(true);
    } else {
      throw new Error(result.error || '保存失败');
    }
  } catch (e) { showToast('保存失败：' + e.message, true); }
  finally { btn.disabled = false; btn.textContent = '保存'; }
}
async function deleteTalent(id) {
  if (!isAdmin()) return;
  if (!confirm('确认删除该人才？此操作不可恢复。')) return;
  try {
    const resp = await fetch(API_BASE + '/api/talent/' + id, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + adminToken }
    });
    const data = await resp.json();
    if (data.success) {
      showToast('✅ 已删除');
      await loadList(true);
    } else throw new Error(data.error || '删除失败');
  } catch (e) { showToast('删除失败：' + e.message, true); }
}
async function blacklistTalent(id) {
  if (!isAdmin()) return;
  const reason = prompt('拉黑原因（必填）:');
  if (!reason || !reason.trim()) return;
  try {
    const resp = await fetch(API_BASE + '/api/talent/' + id + '/blacklist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + adminToken },
      body: JSON.stringify({ reason: reason.trim() })
    });
    const data = await resp.json();
    if (data.success) {
      showToast('✅ 已拉黑');
      await loadList(true);
    } else throw new Error(data.error || '操作失败');
  } catch (e) { showToast('失败：' + e.message, true); }
}
async function restoreTalent(id) {
  if (!isAdmin()) return;
  try {
    const resp = await fetch(API_BASE + '/api/talent/' + id + '/restore', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + adminToken }
    });
    const data = await resp.json();
    if (data.success) { showToast('✅ 已解除黑名单'); await loadList(true); }
    else throw new Error(data.error || '操作失败');
  } catch (e) { showToast('失败：' + e.message, true); }
}

// ============ 事件 ============
let debounceTimer = null;
document.getElementById('searchInput').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => renderList(), 200);
});
document.getElementById('statusFilter').addEventListener('change', renderList);
document.getElementById('positionFilter').addEventListener('change', renderList);

// ============ 启动 ============
updateAuthUI();
loadList();
</script>
